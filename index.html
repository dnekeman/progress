<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WSO2 -> JAVA voortgang</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #172c2b;
            background: #f5f7f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        main {
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            padding: 36px 20px 64px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.8rem;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #536361;
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 12px;
        }

        .summary strong {
            font-size: 1.1rem;
        }

        .summary output {
            font-size: 1.65rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #connection-status {
            min-height: 1.25em;
            margin: 0 0 20px;
            color: #536361;
            font-size: .9rem;
        }

        progress {
            width: 100%;
            height: 12px;
            accent-color: #15745f;
        }

        .overall {
            margin-bottom: 30px;
        }

        .table-wrap {
            width: 100%;
            border: 1px solid #dce5e1;
            background: white;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #e9eeeb;
            text-align: left;
            vertical-align: middle;
        }

        th:nth-child(1) {
            width: 3%;
        }

        th:nth-child(2) {
            width: 30%;
        }

        th:nth-child(3) {
            width: 30%;
        }

        th:nth-child(4) {
            width: 5%;
        }

        th:nth-child(5) {
            width: 7%;
        }

        th:nth-child(6) {
            width: 7%;
        }

        th:nth-child(7) {
            width: 5%;
        }

        th:nth-child(8) {
            width: 5%;
        }

        th:nth-child(9) {
            width: 8%;
        }

        thead {
            background: #e8f0ed;
        }

        th {
            overflow-wrap: anywhere;
            font-size: .83rem;
            font-weight: 700;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #f8faf9;
        }

        td:nth-child(3) {
            font-weight: 600;
        }

        .row-number {
            text-align: right;
            color: #536361;
            font-variant-numeric: tabular-nums;
        }

        .service,
        .java {
            overflow-wrap: anywhere;
        }

        .java span {
            display: block;
        }

        .version {
            overflow-wrap: anywhere;
        }

        .check {
            text-align: center;
        }

        input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: #15745f;
            cursor: pointer;
        }

        .row-progress {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .progress-segments {
            display: grid;
            width: 76px;
            max-width: 100%;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 3px;
            margin-top: 6px;
        }

        .progress-segments span {
            height: 7px;
            background: #dce5e1;
        }

        .progress-segments span.complete {
            background: #15745f;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px 14px 48px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .table-wrap {
                border: 0;
                background: transparent;
            }

            table,
            tbody {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0 12px;
                margin-bottom: 10px;
                padding: 8px 12px;
                border: 1px solid #dce5e1;
                background: white;
            }

            tbody td {
                display: flex;
                min-width: 0;
                flex-direction: column;
                justify-content: center;
                padding: 8px 0;
                border: 0;
                text-align: left;
            }

            tbody td::before {
                margin-bottom: 3px;
                color: #536361;
                content: attr(data-label);
                font-size: .72rem;
                font-weight: 400;
            }

            tbody td:nth-child(1) {
                display: none;
            }

            tbody td:nth-child(2),
            tbody td:nth-child(3),
            tbody td:nth-child(9) {
                grid-column: 1 / -1;
            }

            tbody td.check {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }

            tbody td.check::before {
                margin: 0;
            }

        }
    </style>
</head>

<body>
    <main>
        <h1>Servicevoortgang</h1>
        <p id="connection-status" role="status" aria-live="polite">Openbare pagina: iedereen kan de voortgang wijzigen.</p>
        <div class="summary"><strong>Totale voortgang</strong><output id="total-percent">0%</output></div>
        <progress class="overall" id="total-progress" max="100" value="0" aria-label="Totale voortgang"></progress>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col" class="row-number">#</th>
                        <th scope="col">WSO2 services</th>
                        <th scope="col">Java service naam</th>
                        <th scope="col">Versie</th>
                        <th scope="col" class="check">Playwright tests</th>
                        <th scope="col" class="check">Load tests</th>
                        <th scope="col" class="check">ACC</th>
                        <th scope="col" class="check">PRD</th>
                        <th scope="col">Voortgang (%)</th>
                    </tr>
                </thead>
                <tbody id="services"></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://nfkmnfqblkffafnppgdi.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_XTktAc-2tqJA_B0NfOuClQ_oIvq762W';
        const TABLE_NAME = 'service_progress';
        const stages = [
            { label: 'Playwright tests', column: 'playwright_tests' },
            { label: 'Load tests', column: 'load_tests' },
            { label: 'ACC', column: 'acc' },
            { label: 'PRD', column: 'prd' }
        ];
        const tbody = document.getElementById('services');
        const status = document.getElementById('connection-status');
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        let services = [];

        function updateRowNumbers() {
            Array.from(tbody.rows).forEach((row, index) => {
                row.querySelector('.row-number').textContent = index + 1;
            });
        }

        function updateProgress() {
            let completed = 0;
            for (const service of services) {
                const count = service.stageValues.filter(Boolean).length;
                completed += count;
                const percent = count * 25;
                const cell = tbody.querySelector(`[data-progress="${CSS.escape(service.service_key)}"]`);
                cell.firstChild.textContent = `${percent}%`;
                const segments = cell.querySelector('.progress-segments');
                segments.setAttribute('aria-valuenow', percent);
                Array.from(segments.children).forEach((segment, index) => {
                    segment.classList.toggle('complete', service.stageValues[index]);
                });
            }
            const total = services.length
                ? Math.round(completed / (services.length * stages.length) * 100) : 0;
            document.getElementById('total-percent').value = `${total}%`;
            document.getElementById('total-progress').value = total;
        }

        function renderServices() {
            tbody.replaceChildren();
            services.forEach(service => {
            const row = document.createElement('tr');
            row.dataset.service = service.service_key;
            const numberCell = document.createElement('td');
            numberCell.className = 'row-number';
            row.append(numberCell);
            for (const [text, className] of [
                [service.wso2_service, 'service'],
                [null, 'java'],
                [service.version, 'version']
            ]) {
                const cell = document.createElement('td');
                cell.className = className;
                cell.dataset.label = className === 'service' ? 'WSO2 service'
                    : className === 'java' ? 'Java service naam' : 'Versie';
                if (text !== null) cell.textContent = text;
                else service.java_service_names.forEach(javaName => {
                    const line = document.createElement('span');
                    line.textContent = javaName;
                    cell.append(line);
                });
                row.append(cell);
            }
            stages.forEach((stage, stageIndex) => {
                const cell = document.createElement('td');
                cell.className = 'check';
                cell.dataset.label = stage.label;
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = service.stageValues[stageIndex];
                checkbox.setAttribute('aria-label', `${stage.label} voor ${service.wso2_service}`);
                checkbox.addEventListener('change', async () => {
                    const previousValue = service.stageValues[stageIndex];
                    const nextValue = checkbox.checked;
                    checkbox.disabled = true;
                    const { error } = await supabaseClient.from(TABLE_NAME)
                        .update({ [stage.column]: nextValue })
                        .eq('service_key', service.service_key);
                    if (error) {
                        checkbox.checked = previousValue;
                        status.textContent = `Opslaan mislukt: ${error.message}`;
                    } else {
                        service.stageValues[stageIndex] = nextValue;
                        updateProgress();
                        status.textContent = 'Voortgang opgeslagen en gedeeld.';
                    }
                    checkbox.disabled = false;
                });
                cell.append(checkbox);
                row.append(cell);
            });
            const progressCell = document.createElement('td');
            progressCell.className = 'row-progress';
            progressCell.dataset.label = 'Voortgang';
            progressCell.dataset.progress = service.service_key;
            progressCell.append(document.createTextNode('0%'));
            const bar = document.createElement('div');
            bar.className = 'progress-segments';
            bar.setAttribute('role', 'progressbar');
            bar.setAttribute('aria-valuemin', 0);
            bar.setAttribute('aria-valuemax', 100);
            bar.setAttribute('aria-valuenow', 0);
            bar.setAttribute('aria-label', `Voortgang voor ${service.wso2_service}`);
            stages.forEach(() => bar.append(document.createElement('span')));
            progressCell.append(bar);
            row.append(progressCell);
            tbody.append(row);
            });
            updateRowNumbers();
            updateProgress();
        }

        async function loadServices() {
            status.textContent = 'Gedeelde voortgang laden...';
            const { data, error } = await supabaseClient.from(TABLE_NAME)
                .select('service_key, wso2_service, java_service_names, version, sort_order, playwright_tests, load_tests, acc, prd')
                .order('sort_order');
            if (error) {
                services = [];
                renderServices();
                status.textContent = `Laden mislukt: ${error.message}`;
                return;
            }
            services = data.map(service => ({
                ...service,
                stageValues: stages.map(stage => Boolean(service[stage.column]))
            }));
            renderServices();
            status.textContent = 'Gedeelde voortgang geladen. Iedereen kan wijzigingen aanbrengen.';
        }

        void loadServices();
    </script>
</body>

</html>
